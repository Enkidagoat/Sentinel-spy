<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sentinel-spy dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header><h1>sentinel-spy</h1></header>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flashes">
            {% for cat, msg in messages %}
              <li class="flash {{ cat }}">{{ msg }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <footer><small>Simulation-only dashboard — no destructive actions are enabled.</small></footer>
  </body>
</html>
